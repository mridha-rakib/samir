name: Deploy Website Frontend (PM2)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: github.repository == 'parvesmosarof35/samir-website'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SSH and Deploy via PM2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: GITHUB_TOKEN
          script_stop: true
          script: |
            # 1. Load NVM environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # 2. Enter the frontend project directory
            cd /home/ubuntu/samir-website || exit 1

            # 3. Fetch and sync latest code
            echo "Fetching and syncing latest code..."
            git fetch https://x-access-token:$GITHUB_TOKEN@github.com/parvesmosarof35/samir-website.git main
            git reset --hard FETCH_HEAD
            git clean -fd

            # 4. Install dependencies asdf
            echo "Installing dependencies..."
            pnpm install --frozen-lockfile
            
            # 5. Build Next.js application
            echo "Building application..."
            pnpm build

            # 6. Manage PM2 process
            echo "Managing PM2 process..."
            # Delete existing process to ensure a clean restart
            pm2 delete samir-website || true
            
            # Start Next.js with 500MB memory limit
            pm2 start pnpm --name "samir-website" --max-memory-restart 500M -- start

            # 7. Save PM2 process list
            echo "Saving PM2 process list..."
            pm2 save
            
            echo "Website PM2 Deployment completed successfully!"
